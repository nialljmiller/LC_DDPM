[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lc-ddpm"
version = "2.0.0"
description = "Conditional denoising diffusion model that generates realistic variable-star light curves"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Niall Miller" }]
requires-python = ">=3.9"
dependencies = ["numpy", "torch"]
keywords = ["astronomy", "light curves", "variable stars", "diffusion model", "time series"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest", "matplotlib"]

[project.scripts]
lc-ddpm = "lc_ddpm.cli:main"

[project.urls]
Homepage = "https://github.com/nialljmiller/LC_DDPM"

[tool.hatch.build.targets.wheel]
packages = ["lc_ddpm"]

[tool.hatch.build.targets.sdist]
include = ["lc_ddpm", "tests", "training", "docs", "README.md", "LICENSE", "pyproject.toml"]
